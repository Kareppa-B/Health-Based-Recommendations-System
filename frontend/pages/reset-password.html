<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - Smart Food</title>
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>

<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-brand">
            <div class="floating-icons">
                <div class="floating-icon">🍕</div>
                <div class="floating-icon">🥗</div>
                <div class="floating-icon">🍔</div>
                <div class="floating-icon">🥘</div>
            </div>
            <div class="brand-logo">🍽️</div>
            <h1 class="brand-title">Smart Food</h1>
            <p class="brand-subtitle">
                Discover personalized food recommendations powered by AI.
                Your culinary journey starts here!
            </p>
        </div>

        <div class="login-form-container" style="margin: auto;">
            <div class="form-header">
                <h2 class="form-title">Create a New Password</h2>
                <p class="form-subtitle">Your new password must be at least 6 characters long.</p>
            </div>
            <form class="login-form" id="resetPasswordForm">
                <div class="form-group">
                    <div class="input-group">
                        <input type="password" class="form-input" id="newPassword" placeholder="Enter new password"
                            required>
                        <span class="input-icon">🔒</span>
                        <span class="password-toggle" id="newPasswordToggle">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-group">
                        <input type="password" class="form-input" id="confirmPassword"
                            placeholder="Confirm new password" required>
                        <span class="input-icon">🔒</span>
                        <span class="password-toggle" id="confirmPasswordToggle">👁️</span>
                    </div>
                </div>
                <button type="submit" class="login-button" id="resetBtn">
                    <span id="buttonText">Reset Password</span>
                </button>
            </form>
        </div>
    </div>

    <script src="/frontend/js/reset-password.js"></script>
</body>

</html>
