<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Food Recommendation - Sign Up</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="signup-wrapper">
        <div class="signup-brand">
            <div class="floating-icons">
                <div class="floating-icon">🍕</div>
                <div class="floating-icon">🥗</div>
                <div class="floating-icon">🍔</div>
                <div class="floating-icon">🥘</div>
                <div class="floating-icon">🍜</div>
            </div>
            <div class="brand-logo">🍽️</div>
            <h1 class="brand-title">Smart Food</h1>
            <p class="brand-subtitle">
                Join our community and discover amazing food recommendations tailored just for you.
                Start your personalized culinary adventure today!
            </p>
        </div>

        <div class="signup-form-container">
            <div class="form-header">
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Fill in your details to get started</p>
            </div>

            <form class="signup-form" id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <div class="input-group">
                            <input type="text" class="form-input" id="firstName" placeholder="First Name" required>
                            <span class="input-icon">👤</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-group">
                            <input type="text" class="form-input" id="lastName" placeholder="Last Name" required>
                            <span class="input-icon">👤</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="email" class="form-input" id="email" placeholder="Email Address" required>
                        <span class="input-icon">📧</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="tel" class="form-input" id="phone" placeholder="Phone Number (Optional)"
                            maxlength="10">
                        <span class="input-icon">📱</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="password" class="form-input" id="password" placeholder="Create Password" required>
                        <span class="input-icon">🔒</span>
                        <span class="password-toggle" id="passwordToggle">👁️</span>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill"></div>
                        </div>
                        <span class="strength-text">Password strength</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm Password"
                            required>
                        <span class="input-icon">🔒</span>
                        <span class="password-toggle" id="confirmPasswordToggle">👁️</span>
                    </div>
                </div>

                <button type="submit" class="signup-button" id="signupButton">
                    <div class="button-content">
                        <span id="buttonText">Create Account</span>
                        <div class="loading-spinner" id="loadingSpinner"></div>
                    </div>
                </button>

                <div class="divider">OR</div>

                <div class="social-buttons">
                    <button type="button" class="social-btn google" id="googleBtn">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                            xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                            </path>
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.42-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                            </path>
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                            </path>
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                            </path>
                            <path fill="none" d="M0 0h48v48H0z"></path>
                        </svg>
                        Sign up with Google
                    </button>
                </div>

                <div class="login-text">
                    Already have an account?
                    <a href="login.html" class="login-link" id="loginLink">Sign in</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script src="../js/signup.js"></script>
</body>

</html>
