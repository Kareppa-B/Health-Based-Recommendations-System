<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Food</title>
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>

<body>
    <div class="particles">
    </div>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="floating-icons">
                <div class="floating-icon">🍕</div>
                <div class="floating-icon">🥗</div>
                <div class="floating-icon">🍔</div>
                <div class="floating-icon">🥘</div>
            </div>
            <div class="brand-logo">🍽️</div>
            <h1 class="brand-title">Smart Food</h1>
            <p class="brand-subtitle">
                Discover personalized food recommendations powered by AI.
                Your culinary journey starts here!
            </p>
        </div>

        <div class="login-form-container">
            <div class="form-header">
                <h2 class="form-title">Forgot Password?</h2>
                <p class="form-subtitle">Enter your email to receive a reset link.</p>
            </div>
            <form class="login-form" id="forgotPasswordForm">
                <div class="form-group">
                    <div class="input-group">
                        <input type="email" class="form-input" id="email" placeholder="Enter your registered email"
                            required>
                        <span class="input-icon">📧</span>
                    </div>
                </div>
                <button type="submit" class="login-button" id="sendLinkBtn">
                    <span id="buttonText">Send Reset Link</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
                <div class="signup-text" style="margin-top: 1.5rem;">
                    Remember your password?
                    <a href="login.html" class="signup-link">Back to Sign In</a>
                </div>
            </form>
        </div>
    </div>
    <script src="/frontend/js/forgot-password.js"></script>
</body>

</html>
